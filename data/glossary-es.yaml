# Terminology for the Spanish translation (scripts/translate.mts).
# A change here does not re-translate cached segments: pass --force.

# Register and dialect instruction sent to the model.
style: >-
  Neutral Latin American Spanish. Formal, impersonal register, as in a
  technical specification. Prefer short sentences. Do not add explanations.

# Technical words that stay in English. Names of real things are in "entities".
# A term with a capital letter applies only when the English text has the same
# capitals: "Dev Fund" is the name, "a dev fund" is normal prose.
# The script checks these: a kept term of the English paragraph must be in the
# Spanish paragraph (scripts/translate.mts).
keep:
  - blockchain
  - block chain
  - ZIP
  - nullifier
  - mempool
  - mainnet
  - testnet
  - regtest
  - hash
  - hard fork
  - soft fork
  - fork
  - coinbase
  - lockbox
  - zatoshi
  - ZEC
  - TAZ

# Real things in the Zcash world: organisations, committees, funds, upgrades,
# protocols, software. One entry for each, with one decision:
#   - no "es": the name stays in English, and its short form too.
#   - "es":    the name has this fixed Spanish form; the short form stays.
#   - "gloss": the name stays in English, and its first appearance in the body
#              of each document gets this Spanish text in parentheses:
#              "Zcash Development Fund (Fondo de Desarrollo de Zcash)".
#              For descriptive names only; a brand or a code name has none.
# The list recognises names; it does not correct them. A document that says
# "ECC" says "ECC" in Spanish, also when the organisation has a new name.
# Names come from a count over all documents of the site.
entities:
  # organisations and teams
  - { name: Electric Coin Company, short: ECC, type: organisation }
  - { name: Zcash Foundation, short: ZF, type: organisation, gloss: Fundación Zcash }
  - { name: Zcash Community Grants, short: ZCG, type: organisation, gloss: Subvenciones de la Comunidad de Zcash }
