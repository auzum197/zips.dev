# Always use this Spanish term for the English term.
terms:
  # the long form is written as the usual short one
  memory pool: mempool
  # "chain" alone is Spanish; only "blockchain" / "block chain" stay in English
  chain: cadena
  transaction fee: comisión de transacción
  conventional transaction fee: comisión de transacción convencional
  marginal fee: comisión marginal
  runway: margen financiero
  grant: subvención
  grantee: beneficiario
  shielded: blindado
  transparent: transparente
  note: nota
  wallet: billetera
  miner: minero
  full node: nodo completo
  network upgrade: actualización de red
  consensus rule: regla de consenso
  consensus branch: rama de consenso
  activation height: altura de activación
  block height: altura de bloque
  transaction: transacción
  commitment: compromiso
  zero-knowledge proof: prueba de conocimiento cero
  funding stream: flujo de financiación
  block subsidy: subsidio de bloque
  fee: comisión
  conventional fee: comisión convencional
  rationale: justificación
  abstract: resumen
  motivation: motivación
  specification: especificación
  requirements: requisitos
  deployment: despliegue
  reference implementation: implementación de referencia
  references: referencias
