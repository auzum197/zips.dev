# Watched third-party pull requests, curated per-PR by the site maintainers
# (this file). The primary source of truth is always zcash/zips; entries here
# pin individual external PRs that are fetched at sync time and rendered under
# /external/<id>/<number>/ with explicit provenance. They never mix into the
# canonical ZIP set, the drafts index, or the primary /prs/ listing.
# Remove an entry to untrack that PR.
#
# Fields:
#   id:     URL namespace grouping the watched PRs of one project ([a-z0-9-])
#   repo:   GitHub "owner/name" the PR targets
#   number: the PR number to track
#   label:  display name used in badges and headings
#   note:   one-line provenance note shown on the group's pages
pulls:
  - id: tachyon
    repo: tachyon-zcash/zips
    number: 5
    label: Tachyon
    note: Draft ZIPs for the NuTachyon upgrade — bundle format and shielded protocol drafts. Normative text lives in that repository.
