name: rerun

# Run the failed jobs of a failed sync run again: 5 min after the failure,
# then 15 min after the second failure. Most failures of sync are faults of
# GitHub Pages that go away. A run that still fails after that stays failed.
#
# Only the first attempt of a run starts this workflow; the attempts it makes
# itself are watched here, to the end.
on:
  workflow_run:
    workflows: [sync]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Run the failed jobs again
        run: |
          attempt=1
          for wait in 300 900; do
            echo "attempt $attempt failed; waiting $wait s"
            sleep "$wait"
            gh run rerun "$RUN_ID" --failed
            attempt=$((attempt + 1))
            while :; do
              sleep 30
              state=$(gh run view "$RUN_ID" --json attempt,status,conclusion \
                --jq 'select(.status == "completed") | "\(.attempt) \(.conclusion)"' || true)
              [ "${state%% *}" = "$attempt" ] && break
            done
            echo "attempt $attempt: ${state#* }"
            [ "${state#* }" = "failure" ] || exit 0
          done
          echo "::error::sync run $RUN_ID failed $attempt times"
          exit 1
