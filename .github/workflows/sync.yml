name: sync

# Refresh the vendored zcash/zips clone, render, fetch PRs and publish
# snapshots; then deploy the site and translate what changed. The deploy and
# the translation each need only the snapshots: a deploy that fails does not
# stop the translation. deploy.yml builds the site and deploys it to GitHub
# Pages; rerun.yml runs the failed jobs of a failed run again.
#
# Runs on every push to main (merged PRs deploy immediately), on the daily
# schedule, and on demand. The snapshot commit this job pushes uses
# GITHUB_TOKEN, and GitHub never starts a workflow from such a push, so it
# cannot retrigger itself.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *" # daily, off the hour
  workflow_dispatch:
  repository_dispatch:
    types: [zips-push]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

# one deploy at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.stale.outputs.count }}
    steps:
      # Always work from the tip of main, not the commit that triggered the
      # run. Runs are serialised by the concurrency group, so a queued push run
      # or a rerun would otherwise start behind the snapshot commit the
      # previous run pushed, and its own snapshot commit would conflict.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install docutils

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      # shallow-clone upstream instead of committing the vendor dir
      - name: Vendor zcash/zips
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/zcash/zips vendor/zips

      - name: Render + fetch PRs
        run: pnpm sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snapshots
        run: |
          git config user.name "zips-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content public/api public/upstream
          if git diff --cached --quiet; then
            echo "No snapshot changes — nothing to publish."
          else
            git commit -q -m "sync: refresh snapshots @ $(cd vendor/zips && git rev-parse --short HEAD)"
            # main may have moved while this job ran (that is what triggered us)
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Translation report
        id: stale
        continue-on-error: true
        run: |
          pnpm -s translate --check > "$RUNNER_TEMP/stale.md"
          cat "$RUNNER_TEMP/stale.md" >> "$GITHUB_STEP_SUMMARY"
          echo "count=$(grep -c '^- ' "$RUNNER_TEMP/stale.md" || true)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    uses: ./.github/workflows/deploy.yml

  translate:
    needs: sync
    if: needs.sync.outputs.stale != '0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.publish.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Translate
        continue-on-error: true
        timeout-minutes: 60
        run: pnpm -s translate --all
        env:
          GLM_KEY: ${{ secrets.GLM_KEY }}
          GLM_BASE_URL: ${{ vars.GLM_BASE_URL }}
          GLM_CONCURRENCY: ${{ vars.GLM_CONCURRENCY }}

      - name: Publish translations
        id: publish
        run: |
          git config user.name "zips-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/rendered-es
          if git diff --cached --quiet; then
            echo "No new translations."
          else
            if ! git diff --cached --quiet -- 'content/rendered-es/*.html'; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            fi
            git commit -q -m "sync: refresh translations"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Translation report
        run: pnpm -s translate --check >> "$GITHUB_STEP_SUMMARY"

  deploy-translations:
    needs: [translate, deploy]
    if: ${{ !cancelled() && needs.translate.outputs.deploy == 'true' }}
    uses: ./.github/workflows/deploy.yml
