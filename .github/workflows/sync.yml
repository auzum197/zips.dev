name: sync

# Refresh the vendored zcash/zips clone, render, fetch PRs, publish snapshots,
# build the static site and deploy to GitHub Pages.
#
# Runs on every push to main (merged PRs deploy immediately), on the daily
# schedule, and on demand. The snapshot commit this job pushes uses
# GITHUB_TOKEN, and GitHub never starts a workflow from such a push, so it
# cannot retrigger itself.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *" # daily, off the hour
  workflow_dispatch:
  repository_dispatch:
    types: [zips-push]

permissions:
  contents: write
  pages: write
  id-token: write

# one deploy at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install docutils

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # shallow-clone upstream instead of committing the vendor dir
      - name: Vendor zcash/zips
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/zcash/zips vendor/zips

      - name: Render + fetch PRs
        run: pnpm sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snapshots
        run: |
          git config user.name "zips-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content public/api public/upstream
          if git diff --cached --quiet; then
            echo "No snapshot changes — nothing to publish."
          else
            git commit -q -m "sync: refresh snapshots @ $(cd vendor/zips && git rev-parse --short HEAD)"
            # main may have moved while this job ran (that is what triggered us)
            git pull --rebase --autostash origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          pnpm exec next build
          pnpm exec pagefind --site out

      # actions/upload-pages-artifact v5.0.0 (pinned, matches working zip311 setup)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: out

      # actions/deploy-pages v5.0.1
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
