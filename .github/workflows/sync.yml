name: sync

# Refresh the vendored zcash/zips clone, render, fetch PRs, publish snapshots,
# build the static site and deploy to GitHub Pages.
#
# Runs on every push to main (merged PRs deploy immediately), on the daily
# schedule, and on demand. The snapshot commit this job pushes uses
# GITHUB_TOKEN, and GitHub never starts a workflow from such a push, so it
# cannot retrigger itself.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *" # daily, off the hour
  workflow_dispatch:
  repository_dispatch:
    types: [zips-push]

permissions:
  contents: write
  pages: write
  id-token: write
  # deleting stale github-pages artifacts in the cleanup step below
  actions: write

# one deploy at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always work from the tip of main, not the commit that triggered the
      # run. Runs are serialised by the concurrency group, so a queued push run
      # or a rerun would otherwise start behind the snapshot commit the
      # previous run pushed, and its own snapshot commit would conflict.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install docutils

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      # shallow-clone upstream instead of committing the vendor dir
      - name: Vendor zcash/zips
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/zcash/zips vendor/zips

      - name: Render + fetch PRs
        run: pnpm sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snapshots
        run: |
          git config user.name "zips-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content public/api public/upstream
          if git diff --cached --quiet; then
            echo "No snapshot changes — nothing to publish."
          else
            git commit -q -m "sync: refresh snapshots @ $(cd vendor/zips && git rev-parse --short HEAD)"
            # main may have moved while this job ran (that is what triggered us)
            git pull --rebase --autostash origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          pnpm og
          pnpm exec next build
          pnpm exec pagefind --site out

      # A deploy that fails after the upload leaves the "github-pages" artifact
      # behind, and re-running the job then uploads a second one — deploy-pages
      # refuses to act while two artifacts share its name ("Multiple artifacts
      # unexpectedly found ... count is 2"). Remove any leftovers from a
      # previous attempt of this run before uploading a fresh one.
      - name: Clear stale Pages artifacts
        run: |
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' \
          | while read -r id; do
              echo "deleting stale artifact $id"
              # Never block a deploy over cleanup; a leftover artifact is
              # harmless to deploy-pages (each run uploads its own).
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
            done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # actions/upload-pages-artifact v5.0.0 (pinned, matches working zip311 setup)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: out

      # actions/deploy-pages v5.0.1
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          # Pages propagation for this site has taken ~5 min on good days and
          # exceeded the action's 10 min default once; give it 20 min.
          timeout: 1200000
