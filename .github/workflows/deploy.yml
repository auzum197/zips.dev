name: deploy

# Build the static site from the tip of main and deploy it to GitHub Pages.
on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          pnpm og
          pnpm -s translate --index
          pnpm exec next build
          pnpm html-lang
          pnpm exec pagefind --site out

      - name: Clear stale Pages artifacts
        run: |
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' \
          | while read -r id; do
              echo "deleting stale artifact $id"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
            done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        id: upload
        with:
          path: out

      - name: Wait for the artifact
        continue-on-error: true
        uses: ./.github/actions/wait-for-artifact
        with:
          artifact_id: ${{ steps.upload.outputs.artifact_id }}

      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          timeout: 600000

      - name: Wait before deploying again
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          timeout: 600000
