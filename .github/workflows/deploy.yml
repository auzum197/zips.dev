name: deploy

# Build the static site from the tip of main and deploy it to GitHub Pages.
# sync.yml calls this workflow; it has no trigger of its own.
on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      # deleting stale github-pages artifacts in the cleanup step below
      actions: write
    environment:
      name: github-pages
      # The page URL comes from the attempt that succeeded.
      url: ${{ steps.deploy.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          pnpm og
          pnpm -s translate --index
          pnpm exec next build
          # every language shares one root layout, so the exported pages all
          # say lang="en"; set the right lang before pagefind reads it
          pnpm html-lang
          pnpm exec pagefind --site out

      # A deploy that fails after the upload leaves the "github-pages" artifact
      # behind, and re-running the job then uploads a second one — deploy-pages
      # refuses to act while two artifacts share its name ("Multiple artifacts
      # unexpectedly found ... count is 2"). Remove any leftovers from a
      # previous attempt of this run before uploading a fresh one.
      - name: Clear stale Pages artifacts
        run: |
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' \
          | while read -r id; do
              echo "deleting stale artifact $id"
              # Never block a deploy over cleanup; a leftover artifact is
              # harmless to deploy-pages (each run uploads its own).
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
            done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # actions/upload-pages-artifact v5.0.0 (pinned, matches working zip311 setup)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        id: upload
        with:
          path: out

      # deploy-pages looks up its artifact once, with no retry, and the list
      # can come back empty for an upload that was finalized a moment earlier
      # (actions/deploy-pages#451): 0.5 s after the upload it had no artifact,
      # 30 s later it had one. Ask the same service for the same list until
      # the artifact of this upload is the only "github-pages" in it. When the
      # list cannot be read, wait 30 s. This step never fails the job.
      - name: Wait for the artifact
        continue-on-error: true
        # actions/github-script v8
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            try {
              const token = process.env.ACTIONS_RUNTIME_TOKEN;
              // the ids of the run and the job are in the token: "Actions.Results:<run>:<job>"
              const claims = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString());
              const [, run, job] = claims.scp.split(" ").find((s) => s.startsWith("Actions.Results:")).split(":");
              const url = `${new URL(process.env.ACTIONS_RESULTS_URL).origin}/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts`;
              for (let i = 1; i <= 24; i++) {
                const res = await fetch(url, {
                  method: "POST",
                  headers: { authorization: `Bearer ${token}`, "content-type": "application/json" },
                  body: JSON.stringify({ workflow_run_backend_id: run, workflow_job_run_backend_id: job }),
                });
                if (!res.ok)
                  throw new Error(`ListArtifacts HTTP ${res.status}`);
                const named = ((await res.json()).artifacts ?? []).filter((a) => a.name === "github-pages");
                const id = named[0]?.database_id ?? named[0]?.databaseId;
                if (named.length === 1 && (id === undefined || !process.env.ARTIFACT_ID || String(id) === process.env.ARTIFACT_ID)) {
                  core.info(`the artifact is in the list (check ${i})`);
                  return;
                }
                core.info(`check ${i}: ${named.length} artifact(s) named "github-pages"; waiting 5 s`);
                await sleep(5000);
              }
              core.warning("the artifact is not in the list after 2 min; deploying anyway");
            }
            catch (err) {
              core.warning(`could not read the artifact list (${err.message}); waiting 30 s`);
              await sleep(30000);
            }

      # actions/deploy-pages v5.0.1. A first attempt that fails does not fail
      # the job: the next steps wait and try again. A retry that fails fails
      # the job, and rerun.yml runs the job again later.
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          # 10 min, the most the action permits; it lowers a larger value to this.
          timeout: 600000

      - name: Wait before deploying again
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          timeout: 600000
