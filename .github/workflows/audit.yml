name: audit

# Cheap gate: fail PRs that introduce high or critical vulnerabilities in
# production dependencies. Advisory ignores live in package.json
# (pnpm.auditConfig), so this stays green unless something genuinely new
# shows up.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
